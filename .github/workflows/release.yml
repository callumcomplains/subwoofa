name: Release      - name: Stage the command-line program for the installer
        run: mkdir -p app/src-tauri/installer/stage && cp target/release/subwoofa.exe app/src-tauri/installer/stage/subwoofa.exe



# Push a tag like  b0.1.0-2026-10-11-14-30-00  (b + version from Cargo.toml + UTC date and time) to publish a
# pre-release. "Run workflow" by hand does a dry run: it builds and uploads the files as a workflow artifact only.
on:
  push:
    tags: ['b*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: ver
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            if ! [[ "$TAG" =~ ^b${VERSION}-([0-9]{4})-([0-9]{2})-([0-9]{2})-([0-9]{2})-([0-9]{2})-([0-9]{2})$ ]]; then
              echo "Tag '$TAG' must look like b${VERSION}-YYYY-MM-DD-HH-MM-SS (version comes from Cargo.toml)"; exit 1
            fi
            STAMP="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}-${BASH_REMATCH[3]} ${BASH_REMATCH[4]}:${BASH_REMATCH[5]}:${BASH_REMATCH[6]}"
          else
            TAG="b${VERSION}-dry-run"
            STAMP="$(date -u '+%Y-%m-%d %H:%M:%S')"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"

      - name: Rust toolchain (GNU, so no Visual Studio is needed)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          echo "RUSTUP_TOOLCHAIN=stable-x86_64-pc-windows-gnu" >> "$GITHUB_ENV"
        shell: bash
      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --workspace --exclude subwoofa-app --release
        env:
          SUBWOOFA_BUILD_STAMP: ${{ steps.ver.outputs.stamp }}

      - name: Command-line build
        run: cargo build --release -p sw-cli
        env:
          SUBWOOFA_BUILD_STAMP: ${{ steps.ver.outputs.stamp }}

      - name: Stage the command-line program for the installer
        run: |
          mkdir -p app/src-tauri/installer/stage
          cp target/release/subwoofa.exe app/src-tauri/installer/stage/subwoofa.exe
        shell: bash

      - name: App and installer
        working-directory: app
        run: |
          npm ci
          npx tauri build
        env:
          SUBWOOFA_BUILD_STAMP: ${{ steps.ver.outputs.stamp }}

      - name: Collect files
        run: |
          mkdir out portable
          cp target/release/subwoofa-app.exe portable/Subwoofa.exe
          cp target/release/subwoofa.exe portable/subwoofa-cli.exe
          cp LICENSE README.md portable/
          VER="${{ steps.ver.outputs.tag }}"
          (cd portable && 7z a -tzip "../out/Subwoofa-${VER}-windows-portable.zip" .)
          cp target/release/bundle/nsis/*-setup.exe "out/Subwoofa-${VER}-windows-setup.exe"
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ steps.ver.outputs.tag }}
          path: out/*

      - name: Publish pre-release
        if: github.ref_type == 'tag'
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" out/* \
            --prerelease \
            --title "Subwoofa b${{ steps.ver.outputs.version }} (${{ steps.ver.outputs.stamp }} UTC)" \
            --notes "Public beta, Windows only (macOS and Linux are not yet tested). The files are unsigned, so Windows SmartScreen will warn; check them against SHA256SUMS.txt. Subwoofa does not ship FFmpeg, DTS or Dolby software; see docs/ENGINES.md. See CHANGELOG.md for what is in this release."
        env:
          GH_TOKEN: ${{ github.token }}
