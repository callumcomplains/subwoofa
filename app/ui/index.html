<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subwoofa</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand"><span class="mark" aria-hidden="true"></span><b>Subwoofa</b><i>every channel, every codec</i></div>
  <div id="engine" class="pill">checking engine…</div>
</header>

<main>
  <section class="panel setup">
    <h2>Format</h2>
    <label>Destination<select id="dest"></select></label>
    <label>Stream type<select id="stream"></select></label>
    <label>Channel layout<select id="layout"></select></label>
    <div class="row2">
      <label>Sample rate<select id="rate"></select></label>
      <label>Bit rate (kbps)<input id="bitrate" type="number" step="1"><small id="brange"></small></label>
    </div>
    <label>Dialog normalisation
      <select id="dialnorm"></select>
    </label>
    <svg id="speakers" viewBox="-110 -110 220 220" role="img" aria-label="Speaker layout"></svg>
  </section>

  <section class="panel inputs">
    <div class="head"><h2>Input files</h2><button id="clear" class="ghost">Clear all</button></div>
    <p class="hint">Drop a file on any row, or drop the L file anywhere to auto-import the rest.</p>
    <table id="files">
      <thead><tr><th>Ch</th><th>File</th><th>Ch#</th><th>Bits</th><th>Fs</th><th>Length</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="time">
      <label class="chk"><input type="checkbox" id="entire" checked> Encode entire file</label>
      <label>From (s)<input id="start" type="number" min="0" step="0.1" value="0" disabled></label>
      <label>Length (s)<input id="duration" type="number" min="0" step="0.1" value="60" disabled></label>
    </div>
  </section>

  <section class="panel output">
    <h2>Output</h2>
    <div class="outrow">
      <input id="outdir" placeholder="Folder…" readonly>
      <button id="browse" class="ghost">Browse</button>
    </div>
    <div class="outrow">
      <input id="outname" value="SUBWOOFA" spellcheck="false">
      <span id="ext" class="ext">.ac3</span>
    </div>
    <button id="go" class="primary" disabled>Encode</button>
    <pre id="log" aria-live="polite">Ready.</pre>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
