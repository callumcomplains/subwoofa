[package]
name = "subwoofa-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
sw-core = { path = "../../crates/sw-core" }
sw-backend-ffmpeg = { path = "../../crates/sw-backend-ffmpeg" }
sw-pcm = { path = "../../crates/sw-pcm" }
sw-loudness = { path = "../../crates/sw-loudness" }
sw-queue = { path = "../../crates/sw-queue" }
sw-tools = { path = "../../crates/sw-tools" }
sw-verify = { path = "../../crates/sw-verify" }
sw-backend-dee = { path = "../../crates/sw-backend-dee" }
mimalloc = { version = "0.1", default-features = false }

[features]
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
