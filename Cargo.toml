[workspace]
resolver = "2"
members = ["crates/sw-core", "crates/sw-backend-ffmpeg", "crates/sw-pcm", "crates/sw-queue", "crates/sw-codec-ac3", "crates/sw-cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://example.invalid/subwoofa"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
