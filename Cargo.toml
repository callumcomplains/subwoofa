[workspace]
resolver = "2"
members = ["crates/sw-core", "crates/sw-backend-ffmpeg", "crates/sw-pcm", "crates/sw-queue", "crates/sw-codec-ac3", "crates/sw-codec-truehd", "crates/sw-codec-dts", "crates/sw-codec-pcm", "crates/sw-tools", "crates/sw-verify", "crates/sw-backend-dee", "crates/sw-cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://example.invalid/subwoofa"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

# The signal-processing code follows the specifications' formulas, which index arrays by position; rewriting every
# such loop with iterators would hide the correspondence with the standards.
[workspace.lints.clippy]
needless_range_loop = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
field_reassign_with_default = "allow"

# Audio DSP in an unoptimised build is unusably slow; keep debug info but optimise.
[profile.dev]
opt-level = 2

# Encoders spend their time in tight loops across crate boundaries; whole-program optimisation makes them faster.
[profile.release]
lto = "fat"
codegen-units = 1
